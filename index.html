<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的記賬">
<meta name="theme-color" content="#FBF4EF">
<meta name="robots" content="noindex">
<title>我的記賬</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--pri:#A35C52;--pri2:#C98A7C;--bg:#FBF4EF;--card:#FFFCFA;--ink:#4A3A33;--mut:#7D6A60;--line:#F1E4DB;--soft:#F5E6DE;--neg:#C0392B;--pos:#4F6B45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK",sans-serif;font-size:15px}
body.lock{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.main{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2,h3{margin:0;font-family:"Noto Serif HK","Songti TC",serif}
h3{font-size:16px}.ttl{font-size:22px}.mt{margin-top:14px}
.mut{color:var(--mut);font-size:13px}.center{text-align:center}
.t1{display:block;font-size:15px;font-weight:600}.t2{display:block;font-size:12.5px;color:var(--mut);line-height:1.45}
.t2 i{font-style:normal;color:var(--pri)}
.neg{color:var(--neg)!important}.pos{color:var(--pos)!important}.warn{color:var(--neg);font-size:13px}
.grow{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.hero{border:none;border-radius:22px;padding:0;overflow:hidden;background:#E9D3C9 url(hero.jpg) 50% 22%/cover;min-height:170px;display:flex;align-items:flex-end;text-align:left}
.hero-in{display:flex;flex-direction:column;gap:4px;width:100%;padding:16px;background:linear-gradient(180deg,rgba(255,252,250,0) 0%,rgba(255,252,250,.92) 45%)}
.hero .lbl{font-size:13px;color:var(--mut)}.hero .big{font-family:"Noto Serif HK",serif;font-size:34px;font-weight:700}.hero .sub{font-size:13px;color:var(--mut)}
.bar{display:block;height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:999px}.bar.sm{height:5px;margin-top:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:58px}
.tv{font-size:16px;font-weight:700}
.todo,.row,.brow,.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border:none;border-bottom:1px solid #F6EEE8;background:none;width:100%;text-align:left;min-height:48px}
.row:last-child,.todo:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:999px;flex:none}
.amt{font-weight:700;font-size:14.5px;white-space:nowrap;min-width:92px;text-align:right}.amt.mut{color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:none;border-radius:14px;padding:11px 16px;font-size:15px;font-weight:700;min-height:44px}
.btn.sm{padding:7px 12px;font-size:13px;min-height:36px;border-radius:999px;flex:none}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri2)}
.btn.big{width:100%;margin-top:8px;min-height:50px;font-size:16px}
.filebtn{display:flex;align-items:center;justify-content:center}
.lnk{background:none;border:none;color:var(--pri);font-weight:700;font-size:13px;padding:6px 0;text-align:left}
.plain{background:none;border:none;padding:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px}
.search,.in{width:100%;border:1px solid #E6CFC3;border-radius:12px;padding:10px 12px;background:#fff;min-height:44px}
textarea.in{min-height:110px}
.sum{flex-direction:row;justify-content:space-between}.sum div{display:flex;flex-direction:column}.sum b{font-size:17px}
.pool{display:flex;flex-direction:column;gap:2px;background:var(--soft);border-radius:12px;padding:8px 10px;font-size:13px}
.inner{padding:2px 0 8px 46px;display:flex;flex-direction:column;gap:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;background:rgba(255,252,250,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut);min-width:56px;min-height:48px;opacity:.75}
.tabs button.on{color:var(--pri);font-weight:700;opacity:1}
.fab{width:56px!important;height:56px;min-width:56px!important;border-radius:999px!important;background:var(--pri)!important;color:#fff!important;font-size:30px!important;opacity:1!important;margin-top:-22px;box-shadow:0 6px 16px rgba(163,92,82,.35);justify-content:center}
.scrim{position:fixed;inset:0;background:rgba(74,58,51,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:var(--bg);border-radius:22px 22px 0 0;z-index:31;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:17px}
.x{width:40px;height:40px;border-radius:999px;border:none;background:var(--soft);font-size:16px}
.sheet-body{overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:9px;font-size:15px;font-weight:600;color:var(--mut);min-height:40px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amtbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.amtline{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--pri2)}
.amt-in{flex:1;min-width:0;border:none;background:transparent;font-family:"Noto Serif HK",serif;font-size:34px;font-weight:700;padding:4px 0}
.amt-in:focus{outline:none}
.kpbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:19px;flex:none}.kpbtn.on{background:var(--soft)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kp button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:600}
.calc{min-height:16px;text-align:right}
.chk{display:flex;align-items:center;gap:6px;background:none;border:none;font-size:13px;color:var(--mut);min-height:34px;padding:4px 0}
.chk i{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--pri2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}
.chk.on i{background:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:none;background:var(--soft);color:#6B5A51;border-radius:999px;padding:8px 12px;font-size:13px;min-height:36px}
.chip.on{background:var(--pri);color:#fff;font-weight:700}
.achip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;min-height:38px}
.achip.on{border:2px solid var(--pri);background:#FFF5F0;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gtile,.ctile{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 4px;font-size:12.5px;min-height:76px}
.picked{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left}
.two{display:flex;gap:8px;align-items:flex-end}.two>*{flex:1}
label.t2{display:flex;flex-direction:column;gap:4px}
.octrow,.prow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.est{font-style:normal;font-size:11px;background:#FBEBC8;color:#8A6416;border-radius:6px;padding:1px 6px}
.box{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hello p{margin:4px 0 8px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);background:#4A3A33;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:50;max-width:88vw;text-align:center}
.a56,.a44,.a36,.a28{background-image:url(icons-a.webp);background-repeat:no-repeat;flex:none;display:block}
.b56,.b44,.b36,.b28{background-image:url(icons-b.webp);background-repeat:no-repeat;flex:none;display:block}
.a44{background-size:484px 484px;width:44px;height:44px}.b44{background-size:176px 484px;width:44px;height:44px}
.a36{background-size:396px 396px;width:36px;height:36px}.b36{background-size:144px 396px;width:36px;height:36px}
.a28{background-size:308px 308px;width:28px;height:28px}.b28{background-size:112px 308px;width:28px;height:28px}
.icx36{width:36px;height:36px;flex:none}.icx28{width:28px;height:28px;flex:none}.icx44{width:44px;height:44px;flex:none}
@media (prefers-color-scheme:dark){:root{--bg:#1F1916;--card:#2A221E;--ink:#F2E6DF;--mut:#B8A69B;--line:#3A2F2A;--soft:#3A2D27}
 .btn.ghost,.in,.search,.kp button,.kpbtn,.achip,.gtile,.ctile,.picked,.seg button.on{background:#2F2622;color:var(--ink)}
 .hero-in{background:linear-gradient(180deg,rgba(31,25,22,0) 0%,rgba(31,25,22,.9) 45%)}.tabs{background:rgba(31,25,22,.96)}}
</style>
</head>
<body>
<div id="app"></div>
<noscript>要開 JavaScript 先用到。</noscript>
<script src="app.js"></script>
</body>
</html>
